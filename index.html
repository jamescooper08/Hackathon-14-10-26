<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CandleView | Stock charts</title>
  <script src="https://unpkg.com/lightweight-charts@4.2.3/dist/lightweight-charts.standalone.production.js"></script>
  <style>
    :root { color-scheme: dark; font-family: system-ui, -apple-system, sans-serif; background:#0b1020; color:#edf2ff; }
    * { box-sizing:border-box; } body { margin:0; }
    main { max-width:1150px; margin:auto; padding:28px 18px 40px; }
    header { display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; gap:12px; margin-bottom:30px; }
    h1 { margin:0; letter-spacing:-.04em; font-size:clamp(1.8rem, 4vw, 2.5rem); }
    h1 span { color:#46cfab; } .subtle { color:#9aaac7; font-size:.89rem; }
    .card { background:#111a2d; border:1px solid #26334b; border-radius:16px; padding:20px; box-shadow:0 16px 50px #04091444; }
    .controls { display:flex; flex-wrap:wrap; gap:12px; align-items:flex-end; margin-bottom:20px; }
    .search-wrap { position:relative; flex:1 1 260px; }
    label { display:block; color:#9aacc9; margin-bottom:8px; font-size:.84rem; }
    input, button { font:inherit; }
    input { width:100%; padding:11px 14px; background:#0b1427; border:1px solid #384b68; border-radius:10px; color:#fff; outline:none; }
    input:focus { border-color:#46cfab; }
    button { cursor:pointer; color:#edf2ff; border:1px solid #34425a; border-radius:9px; background:#19243a; padding:10px 15px; }
    button:hover, button:focus-visible { border-color:#46cfab; }
    button:disabled { cursor:wait; opacity:.55; }
    .primary { background:#36b994; border-color:#36b994; color:#061b19; font-weight:700; }
    #suggestions { position:absolute; z-index:10; top:100%; margin-top:5px; width:100%; max-height:270px; overflow:auto; padding:4px; background:#19243a; border:1px solid #3a4c68; border-radius:10px; box-shadow:0 15px 28px #04091499; }
    #suggestions[hidden] { display:none; }
    #suggestions button { display:block; width:100%; text-align:left; border:0; background:transparent; }
    #suggestions button:hover { background:#2b3c59; }
    #suggestions small { display:block; color:#a9b7cd; margin-top:2px; }
    .intervals { display:flex; flex-wrap:wrap; gap:6px; margin-left:auto; }
    .intervals button { padding:9px 11px; }
    .intervals .active { color:#061b19; background:#46cfab; border-color:#46cfab; font-weight:700; }
    .heading { display:flex; flex-wrap:wrap; gap:12px; align-items:baseline; justify-content:space-between; }
    h2 { margin:2px 0 8px; font-size:1.55rem; } #details { margin:0 0 18px; }
    #status { min-height:24px; margin:0 0 12px; color:#adc2dc; } #status.error { color:#ff999d; }
    #chart { height:clamp(360px, 60vh, 630px); width:100%; }
    .legend { display:flex; flex-wrap:wrap; gap:16px; padding:12px 0 0; font-size:.88rem; color:#b7c6df; }
    .legend strong { color:#fff; } footer { margin-top:20px; text-align:center; }
    @media (max-width:650px) { .controls > .primary { flex:1 1 100%; } .intervals { margin:0; width:100%; justify-content:space-between; } .intervals button { flex:1; } .card { padding:12px; } }
  </style>
</head>
<body>
  <main>
    <header><div><h1><span>▥</span> CandleView</h1><div class="subtle">The market, one candle at a time.</div></div><div class="subtle">Historical OHLCV · refresh to check for new bars</div></header>
    <section class="card" aria-label="Stock candlestick chart">
      <div class="controls">
        <div class="search-wrap">
          <label for="ticker">Search stock ticker or company name</label>
          <input id="ticker" value="AAPL" autocomplete="off" placeholder="e.g. AAPL or Apple" aria-controls="suggestions" aria-autocomplete="list">
          <div id="suggestions" role="listbox" hidden></div>
        </div>
        <button id="load" class="primary">Show chart</button>
        <div class="intervals" role="group" aria-label="Candle interval">
          <button data-interval="1m">1m</button><button data-interval="5m">5m</button><button data-interval="15m">15m</button>
          <button data-interval="1h">1h</button><button data-interval="1D" class="active">1D</button><button data-interval="1W">1W</button>
        </div>
      </div>
      <div class="heading"><h2 id="title">AAPL · Candlestick chart</h2><span id="details" class="subtle"></span></div>
      <p id="status" role="status" aria-live="polite">Loading candles…</p>
      <div id="chart" aria-label="Interactive candlestick and volume chart"></div>
      <div id="legend" class="legend">Hover over a candle to see open, high, low, close and volume.</div>
    </section>
    <footer class="subtle">Source: Twelve Data · Market data may be delayed · For information only, not investment advice.</footer>
  </main>
  <script>
    const input = document.querySelector('#ticker');
    const suggestions = document.querySelector('#suggestions');
    const status = document.querySelector('#status');
    const title = document.querySelector('#title');
    const details = document.querySelector('#details');
    const legend = document.querySelector('#legend');
    const loadButton = document.querySelector('#load');
    const intervalButtons = [...document.querySelectorAll('[data-interval]')];
    let symbol = 'AAPL';
    let interval = '1D';
    let bars = [];
    let timer;
    let searchController;
    let chartController;

    const chart = LightweightCharts.createChart(document.querySelector('#chart'), {
      layout: { background: { color:'#111a2d' }, textColor:'#a9b9d4', fontFamily:'system-ui' },
      grid: { vertLines:{ color:'#1d2a40' }, horzLines:{ color:'#1d2a40' } },
      crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
      timeScale: { borderColor:'#32415b', timeVisible:true },
      rightPriceScale: { borderColor:'#32415b', scaleMargins:{ top:0.08, bottom:0.25 } },
      localization: { locale:'en-GB' },
      width: document.querySelector('#chart').clientWidth,
      height: document.querySelector('#chart').clientHeight
    });
    const candles = chart.addCandlestickSeries({ upColor:'#46cfab', downColor:'#ff6876', borderVisible:false, wickUpColor:'#46cfab', wickDownColor:'#ff6876' });
    const volumes = chart.addHistogramSeries({ priceFormat:{ type:'volume' }, priceScaleId:'' });
    volumes.priceScale().applyOptions({ scaleMargins:{ top:0.79, bottom:0 } });
    new ResizeObserver(entries => chart.applyOptions({ width: entries[0].contentRect.width, height:entries[0].contentRect.height }))
      .observe(document.querySelector('#chart'));

    function setStatus(message, error=false) { status.textContent = message; status.classList.toggle('error', error); }
    function showLegend(bar) {
      if (!bar) { legend.textContent = 'Hover over a candle to see open, high, low, close and volume.'; return; }
      const number = n => n.toLocaleString('en-GB', { minimumFractionDigits:2, maximumFractionDigits:4 });
      const date = typeof bar.time === 'number' ? new Date(bar.time * 1000).toLocaleString('en-GB', { timeZone:'UTC' }) + ' UTC' : bar.time;
      legend.innerHTML = '';
      for (const [key, value] of Object.entries({ Date:date, Open:number(bar.open), High:number(bar.high), Low:number(bar.low), Close:number(bar.close), Volume:bar.volume == null ? 'N/A' : bar.volume.toLocaleString('en-GB') })) {
        const item = document.createElement('span');
        const label = document.createElement('strong'); label.textContent = `${key}: `;
        item.append(label, document.createTextNode(value)); legend.append(item);
      }
    }
    chart.subscribeCrosshairMove(param => showLegend(param.time ? bars.find(bar => {
      if (typeof bar.time === 'string' && typeof param.time === 'object')
        return bar.time === `${param.time.year}-${String(param.time.month).padStart(2,'0')}-${String(param.time.day).padStart(2,'0')}`;
      return bar.time === param.time;
    }) : null));

    async function loadChart(nextSymbol=symbol) {
      const candidate = nextSymbol.trim().toUpperCase();
      if (!/^[A-Z0-9][A-Z0-9.:-]{0,19}$/.test(candidate)) { setStatus('Select a stock from the suggestions or enter a valid ticker.', true); return; }
      chartController?.abort(); chartController = new AbortController();
      const controller = chartController;
      loadButton.disabled = true; setStatus(`Loading ${candidate} ${interval} candles…`);
      suggestions.hidden = true;
      try {
        const response = await fetch(`/api/candles?symbol=${encodeURIComponent(candidate)}&interval=${encodeURIComponent(interval)}`, { signal:controller.signal });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || 'Could not load candles.');
        if (controller !== chartController) return;
        symbol = candidate; input.value = candidate;
        bars = data.bars;
        candles.setData(bars.map(({ time, open, high, low, close }) => ({ time, open, high, low, close })));
        volumes.setData(bars.filter(bar => bar.volume !== null).map(bar => ({ time:bar.time, value:bar.volume, color:bar.close >= bar.open ? '#46cfab88' : '#ff687688' })));
        chart.timeScale().fitContent();
        title.textContent = `${data.symbol} · Candlestick chart`;
        details.textContent = [data.exchange, data.currency, `${interval} candles`, `Times: ${data.timezone}`].filter(Boolean).join(' · ');
        showLegend(bars.at(-1)); setStatus(`${bars.length} candles loaded. Drag to pan, scroll or pinch to zoom.`);
      } catch (error) { if (error.name !== 'AbortError') setStatus(error.message, true); }
      finally { if (controller === chartController) loadButton.disabled = false; }
    }

    function choose(item) { input.value = item.symbol; suggestions.hidden = true; loadChart(item.symbol); }
    input.addEventListener('input', () => {
      clearTimeout(timer); searchController?.abort(); suggestions.hidden = true;
      const q = input.value.trim(); if (q.length < 2) return;
      timer = setTimeout(async () => {
        searchController = new AbortController();
        try {
          const response = await fetch(`/api/search?q=${encodeURIComponent(q)}`, { signal:searchController.signal });
          if (!response.ok) return;
          const data = await response.json();
          if (input.value.trim() !== q) return;
          suggestions.replaceChildren();
          for (const item of data.results || []) {
            const button = document.createElement('button'); button.type = 'button'; button.setAttribute('role','option');
            const name = document.createElement('small'); name.textContent = `${item.name || ''} · ${item.exchange || ''}`;
            button.append(document.createTextNode(item.symbol), name);
            button.addEventListener('click', () => choose(item)); suggestions.append(button);
          }
          suggestions.hidden = !suggestions.childElementCount;
        } catch (error) { if (error.name !== 'AbortError') console.error(error); }
      }, 350);
    });
    input.addEventListener('keydown', event => {
      if (event.key === 'Escape') suggestions.hidden = true;
      if (event.key === 'Enter') { event.preventDefault(); choose({ symbol: input.value }); }
    });
    document.addEventListener('click', event => { if (!event.target.closest('.search-wrap')) suggestions.hidden = true; });
    loadButton.addEventListener('click', () => loadChart(input.value));
    intervalButtons.forEach(button => button.addEventListener('click', () => {
      interval = button.dataset.interval;
      intervalButtons.forEach(item => item.classList.toggle('active', item === button));
      loadChart(symbol);
    }));
    loadChart();
  </script>
</body>
</html>
